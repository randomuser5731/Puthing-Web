<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="https://static.wikitide.net/secretuniversewikiwiki/thumb/8/85/Puthing_Around.png/150px-Puthing_Around.png" />
<title>Puthing Around</title>
<style>
html,body{margin:0;padding:0;background:#000;height:100%;display:flex;align-items:center;justify-content:center;color:#a67c3c;font:14px/1.6 "Space Mono",monospace;text-align:center}
.container{max-width:500px;padding:20px;opacity:0.3;position:relative}
.hidden{display:none}
.ghost{color:#222;font-size:11px;margin-top:40px;opacity:0.5}
.secret{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#1a1a1a;font-size:10px;pointer-events:none;opacity:0.3;letter-spacing:4px}
.matrix{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:0.03}
</style>
</head>
<body oncontextmenu="return false">
<div class="matrix" id="matrix"></div>
<div class="container" style="position:relative;z-index:1">
  what you see is not the truth
  <div class="hidden">z is not the end</div>
  <div class="hidden">the answer hides in plain sight</div>
  <div class="hidden">read between the lines</div>
  <div class="ghost">.</div>
  <div class="secret">SOPYKXDQHARWZCUT</div>
</div>
<script>
document.onkeydown = function(e) {
  if (e.key === 'F12' || (e.ctrlKey && (e.key === 'u' || e.key === 'U'))) {
    return false;
  }
};
console.log("%c[HIDDEN]","color:#a67c3c;font-weight:bold","what you see is not the truth");

var chars = "SOPYKXDQHARWZCUT01";
var matrix = document.getElementById('matrix');
for(var i=0;i<50;i++){
  var el = document.createElement('div');
  el.textContent = chars[Math.floor(Math.random()*chars.length)];
  el.style.position = 'absolute';
  el.style.left = Math.random()*100+'%';
  el.style.top = Math.random()*100+'%';
  el.style.color = '#a67c3c';
  el.style.fontSize = '10px';
  matrix.appendChild(el);
}
</script>
</body>
</html>
