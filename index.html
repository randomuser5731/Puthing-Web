<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="https://static.wikitide.net/secretuniversewikiwiki/thumb/8/85/Puthing_Around.png/150px-Puthing_Around.png" />
<title>Puthing Around</title>
<style>
  html,body{margin:0;padding:0;background:#000;height:100%;overflow:hidden;font-family:monospace}
  #grid{display:grid;grid-template-columns:repeat(4,60px);grid-template-rows:repeat(4,60px);gap:0;justify-content:center;align-content:center;height:100%}
  .cell{border:1px solid #333;width:60px;height:60px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;cursor:pointer}
  .cell.selected{background:#fff;color:#000}
  #overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;color:#a67c3c;font:16px monospace;text-align:center;z-index:10;background:#000;cursor:pointer}
  #overlay.active{display:flex}
  #overlay .title{color:#4a6a44;font-size:18px;margin-bottom:10px}
  #overlay .sub{color:#a67c3c;font-size:14px}
</style>
</head>
<body oncontextmenu="return false">
<div id="grid"></div>
<div id="overlay"></div>
<script>
document.onkeydown = function(e) {
  if (e.key === 'F12' || (e.ctrlKey && (e.key === 'u' || e.key === 'U'))) {
    return false;
  }
};

var SUPABASE_URL = "https://ovxndyvhpvtvwmubflth.supabase.co";
var SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im92eG5keXZocHZ0dndtdWJmbHRoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI5OTI2NzgsImV4cCI6MjA5ODU2ODY3OH0.wT3uI4NR_Z1BLYdMRqoYw0OtVznqRD5pUiLbafMGDRI";
var CODE_LENGTH = 16;
var LETTERS = ["S","O","P","Y","K","X","D","Q","H","A","R","W","Z","C","U","T"];
var guess = [];
var grid = document.getElementById('grid');
var overlay = document.getElementById('overlay');

LETTERS.forEach(function(l){
  var d = document.createElement('div');
  d.className = 'cell';
  d.textContent = l;
  grid.appendChild(d);
});

document.body.addEventListener('click', function(e){
  var el = e.target;
  if(!el || !el.classList.contains('cell')) return;
  if(guess.length < CODE_LENGTH){
    guess.push(el.textContent);
    el.classList.add('selected');
    if(guess.length >= CODE_LENGTH) checkGuess();
  }
});

document.body.addEventListener('mouseleave', function(){
  guess = [];
  document.querySelectorAll('.cell.selected').forEach(function(c){ c.classList.remove('selected'); });
});

function showOverlay(html){
  overlay.innerHTML = html;
  overlay.classList.add('active');
  grid.style.display = 'none';
}

overlay.addEventListener('click', function(){
  overlay.classList.remove('active');
  grid.style.display = '';
  guess = [];
  document.querySelectorAll('.cell.selected').forEach(function(c){ c.classList.remove('selected'); });
});

function checkGuess(){
  var g = guess.join('').toLowerCase();
  guess = [];
  document.querySelectorAll('.cell.selected').forEach(function(c){ c.classList.remove('selected'); });
  if(g === 'throzyckd'){
    showOverlay('<div class="title">nice try</div>');
    return;
  }
  if(g.length === CODE_LENGTH){
    fetch(SUPABASE_URL+'/rest/v1/rpc/verify_code',{
      method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY},
      body:JSON.stringify({guess:g})
    }).then(function(r){ return r.json(); }).then(function(d){
      if(d && d.correct){
        fetch(SUPABASE_URL+'/rest/v1/rpc/get_winner',{
          method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY},
          body:JSON.stringify({})
        }).then(function(r){ return r.json(); }).then(function(w){
          var winner = w ? w.winner : 'Anonymous';
          showOverlay('<div class="title">YOU WIN</div><div class="sub">winner: '+winner+'</div>');
        });
      }
    });
  }
}
</script>
</body>
</html>
