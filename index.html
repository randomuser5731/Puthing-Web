<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="https://static.wikitide.net/secretuniversewikiwiki/thumb/8/85/Puthing_Around.png/150px-Puthing_Around.png" />
<title>Puthing Around</title>
<style>
  html,body{margin:0;padding:0;background:#000;height:100%;overflow:hidden;font-family:monospace}
  body::before{content:"";position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.15) 2px,rgba(0,0,0,0.15) 4px);pointer-events:none;z-index:2}
  #grid{display:grid;grid-template-columns:repeat(4,60px);grid-template-rows:repeat(4,60px);gap:0;justify-content:center;align-content:center;height:100%;position:relative;z-index:1}
  .cell{border:1px solid #333;width:60px;height:60px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;cursor:pointer;transition:all .15s;position:relative;overflow:hidden}
  .cell::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,transparent 40%,rgba(255,255,255,0.03) 50%,transparent 60%);pointer-events:none;opacity:0;transition:opacity .3s}
  .cell:hover::after{opacity:1}
  .cell:hover{border-color:#555;box-shadow:0 0 12px rgba(166,124,60,0.2),inset 0 0 12px rgba(166,124,60,0.1)}
  .cell.selected{background:#fff;color:#000;border-color:#fff;box-shadow:0 0 20px rgba(255,255,255,0.4)}
  #overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;color:#a67c3c;font:16px monospace;text-align:center;z-index:10;background:rgba(0,0,0,0.95);opacity:0;transition:opacity .6s}
  #overlay.active{display:flex;opacity:1}
  #overlay .title{color:#4a6a44;font-size:24px;margin-bottom:15px;letter-spacing:8px;text-shadow:0 0 20px rgba(74,106,68,0.6)}
  #overlay .sub{color:#a67c3c;font-size:14px;letter-spacing:3px}
  @keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
  .pulse{animation:pulse 2s infinite}
</style>
</head>
<body oncontextmenu="return false">
<div id="grid"></div>
<div id="overlay"></div>
<script>
document.onkeydown = function(e) {
  if (e.key === 'F12' || (e.ctrlKey && (e.key === 'u' || e.key === 'U'))) {
    return false;
  }
};

var SUPABASE_URL = "https://ovxndyvhpvtvwmubflth.supabase.co";
var SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im92eG5keXZocHZ0dndtdWJmbHRoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI5OTI2NzgsImV4cCI6MjA5ODU2ODY3OH0.wT3uI4NR_Z1BLYdMRqoYw0OtVznqRD5pUiLbafMGDRI";
var CODE_LENGTH = 16;
var LETTERS = ["S","O","P","Y","K","X","D","Q","H","A","R","W","Z","C","U","T"];
var guess = [];
var grid = document.getElementById('grid');
var overlay = document.getElementById('overlay');

console.log("%cPuthing Around","color:#a67c3c;font-size:20px;font-weight:bold");
console.log("%cThe cipher awaits...","color:#4a6a44;font-style:italic");
console.log("%cType 'hint()' for a whisper from the void","color:#333;font-size:11px");

window.hint = function(){
  fetch(SUPABASE_URL+'/rest/v1/rpc/get_hint',{
    method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY},
    body:JSON.stringify({})
  }).then(function(r){ return r.json(); }).then(function(h){
    console.log("%c[HINT]","color:#a67c3c;font-weight:bold","%c"+h.hint,"color:#a67c3c");
    console.log("%cAttempts: "+h.attempts+" | Level: "+h.level,"color:#333;font-size:10px");
  });
};

var audioCtx = null;
function playSound(freq, duration, type){
  try{
    if(!audioCtx) audioCtx = new(window.AudioContext||window.webkitAudioContext)();
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = type||'square';
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.05, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+duration);
    o.connect(g);
    g.connect(audioCtx.destination);
    o.start(audioCtx.currentTime);
    o.stop(audioCtx.currentTime+duration);
  }catch(e){}
}

LETTERS.forEach(function(l){
  var d = document.createElement('div');
  d.className = 'cell';
  d.textContent = l;
  d.title = '';
  grid.appendChild(d);
});

document.body.addEventListener('click', function(e){
  var el = e.target;
  if(!el || !el.classList.contains('cell')) return;
  if(guess.length < CODE_LENGTH){
    guess.push(el.textContent);
    el.classList.add('selected');
    playSound(800+guess.length*40, 0.08);
    if(guess.length >= CODE_LENGTH) checkGuess();
  }
});

document.body.addEventListener('mouseleave', function(){
  guess = [];
  document.querySelectorAll('.cell.selected').forEach(function(c){ c.classList.remove('selected'); });
  playSound(200, 0.15, 'sawtooth');
});

function showOverlay(html){
  overlay.innerHTML = html;
  overlay.classList.add('active');
  grid.style.display = 'none';
  playSound(600, 0.3);
  setTimeout(function(){ playSound(900, 0.4); }, 150);
}

function checkGuess(){
  var g = guess.join('').toLowerCase();
  guess = [];
  document.querySelectorAll('.cell.selected').forEach(function(c){ c.classList.remove('selected'); });
  if(g === 'throzyckd'){
    showOverlay('<div class="title pulse">nice try</div><div class="sub">but the cipher remains sealed</div>');
    return;
  }
  if(g.length === CODE_LENGTH){
    fetch(SUPABASE_URL+'/rest/v1/rpc/verify_code',{
      method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY},
      body:JSON.stringify({guess:g})
    }).then(function(r){ return r.json(); }).then(function(d){
      if(d && d.correct){
        playSound(523, 0.15);
        setTimeout(function(){ playSound(659, 0.15); }, 150);
        setTimeout(function(){ playSound(784, 0.3); }, 300);
        fetch(SUPABASE_URL+'/rest/v1/rpc/get_winner',{
          method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY},
          body:JSON.stringify({})
        }).then(function(r){ return r.json(); }).then(function(w){
          var winner = w ? w.winner : 'Anonymous';
          showOverlay('<div class="title" style="animation:fadeInUp .8s">YOU WIN</div><div class="sub" style="animation:fadeInUp .8s .2s both">the cipher is broken<br>winner: '+winner+'</div>');
        });
      }else{
        playSound(150, 0.4, 'sawtooth');
        document.querySelectorAll('.cell.selected').forEach(function(c){
          c.style.borderColor = '#a67c3c';
          setTimeout(function(){ c.style.borderColor = '#333'; }, 300);
        });
      }
    });
  }
}
</script>
</body>
</html>
